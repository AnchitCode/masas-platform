name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Lint Backend ────────────────────────────────────────

  lint-server:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - run: npm run lint
        working-directory: server

  # ─── Lint Frontend ───────────────────────────────────────

  lint-client:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - run: npm run lint
        working-directory: client

  # ─── Test Backend ────────────────────────────────────────

  test-server:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-server

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://masas_test:masas_test_password@localhost:5432/masas_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-minimum-32-characters-long
      NODE_ENV: test
      RATE_LIMIT_MAX: 10000
      DATABASE_BRANCH: masas-test
      ALLOW_TEST_DB_RESET: 'true'
      SAFE_TEST_DATABASE_HOST: localhost
      SAFE_TEST_DATABASE_NAME: masas_test
      PRODUCTION_DATABASE_HOST: ${{ secrets.PRODUCTION_DATABASE_HOST }}
      # Auth placeholders — not real secrets, just enough to pass env validation
      GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
      SMTP_HOST: localhost
      SMTP_PORT: '587'
      SMTP_USER: ci-test@localhost
      SMTP_PASS: ci-placeholder-password
      SMTP_FROM: noreply@masas-test.localhost

    steps:
      - uses: actions/checkout@v4

      # ── Build & start PostgreSQL 16 with PostGIS + pgvector ──
      - name: Build CI Postgres image (PostGIS + pgvector)
        run: docker build -t masas-ci-postgres -f .github/docker/ci-postgres.Dockerfile .

      - name: Start CI Postgres container
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=masas_test \
            -e POSTGRES_PASSWORD=masas_test_password \
            -e POSTGRES_DB=masas_test \
            -p 5432:5432 \
            masas-ci-postgres

      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U masas_test 2>/dev/null; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Verify extensions are available
        run: |
          docker exec ci-postgres psql -U masas_test -d masas_test -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS vector;"
          docker exec ci-postgres psql -U masas_test -d masas_test -c "SELECT extname, extversion FROM pg_extension WHERE extname IN ('postgis', 'vector');"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: server

      - name: Run Migrations
        run: npx prisma migrate deploy
        working-directory: server

      - name: Run Tests with Coverage
        run: npm run test:coverage
        working-directory: server

  # ─── Build Frontend ──────────────────────────────────────

  build-client:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - run: npm run build
        working-directory: client
